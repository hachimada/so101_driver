# Lint and format settings. Run `ruff check .` and `ruff format .` in this directory.
line-length = 100
target-version = "py310"  # ROS 2 Humble on Ubuntu 22.04
extend-exclude = ["vendor"]  # The official Feetech SDK is kept unmodified.

[lint]
# pycodestyle errors and warnings, pyflakes, and import order.
select = ["E", "F", "W", "I"]

[lint.isort]
known-first-party = ["so101_driver"]
